name: Vitest
on: [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: problem_manager_test
          POSTGRES_USER: pm
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm install
      - name: Install latex
        working-directory: lang-latex
        run: npm install
      - name: Init test database schema
        working-directory: server
        run: npm run test:init
        env:
          TEST_DATABASE_URL: 'postgresql://pm:password@localhost:5432/problem_manager_test'
      - name: Run server tests
        working-directory: server
        run: npm run test
        env:
          TEST_DATABASE_URL: 'postgresql://pm:password@localhost:5432/problem_manager_test'
