name: Typecheck
on: [pull_request]

jobs:
  client:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm install
      - name: Install server dependencies
        working-directory: server
        run: npm install
      - name: Install latex
        working-directory: lang-latex
        run: npm install
      - name: Run client typecheck
        working-directory: client
        run: npm run typecheck

  server:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm install
      - name: Install latex
        working-directory: lang-latex
        run: npm install
      - name: Run client typecheck
        working-directory: server
        run: npm run typecheck

  builder:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./package-lock.json
      - name: Install dependencies
        working-directory: builder
        run: npm install
      - name: Run client typecheck
        working-directory: builder
        run: npm run typecheck
